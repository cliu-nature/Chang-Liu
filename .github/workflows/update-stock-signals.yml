name: Update Stock Signals

on:
  schedule:
    # GitHub Actions cron is UTC.
    # 07:45 UTC = 16:45 JST, after Tokyo market close.
    # 09:15 UTC = 18:15 JST, backup run for delayed quote publication.
    - cron: "45 7 * * 1-5"
    - cron: "15 9 * * 1-5"
    # 11:30 UTC = 20:30 JST, final backup run.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "stock-signals/watchlist.json"
      - "stock-signals/analyst_snapshot.json"
      - "stock-signals/update_signals.py"
      - ".github/workflows/update-stock-signals.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update signals
        run: python stock-signals/update_signals.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- stock-signals/signals.json; then
            echo "No signal changes to commit."
            exit 0
          fi

          git config user.name "stock-signals-bot"
          git config user.email "stock-signals-bot@users.noreply.github.com"
          git add stock-signals/signals.json
          git commit -m "Update stock signals"
          git push
