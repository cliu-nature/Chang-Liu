name: Update Stock Signals

on:
  schedule:
    # Tokyo market closes at 15:30. Allow the daily bar to finalize before fetching.
    # The second run guards against delayed publication by the quote provider.
    - cron: "45 16 * * 1-5"
      timezone: "Asia/Tokyo"
    - cron: "15 18 * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
  push:
    paths:
      - "stock-signals/watchlist.json"
      - "stock-signals/update_signals.py"
      - ".github/workflows/update-stock-signals.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update signals
        run: python stock-signals/update_signals.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- stock-signals/signals.json; then
            echo "No signal changes to commit."
            exit 0
          fi

          git config user.name "stock-signals-bot"
          git config user.email "stock-signals-bot@users.noreply.github.com"
          git add stock-signals/signals.json
          git commit -m "Update stock signals"
          git push
