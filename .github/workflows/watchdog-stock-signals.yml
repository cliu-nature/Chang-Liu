name: Watchdog Stock Signals

on:
  schedule:
    - cron: "17 21 * * 1-5" # 06:17 JST Tuesday through Saturday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r stock-signals/requirements.txt
      - name: Check published raw GitHub feed against Tokyo calendar
        shell: bash
        run: |
          set -o pipefail
          feed="$RUNNER_TEMP/published-stock-signals.json"
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/stock-signals/signals.json?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$feed"
          python stock-signals/update_signals.py --check --output "$feed" | tee -a "$GITHUB_STEP_SUMMARY"
